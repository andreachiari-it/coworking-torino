<style>
  .space-detail-page {
    max-width: 760px;
    margin-inline: auto;
    padding: var(--space-5) var(--space-5) var(--space-8);
  }
  .space-detail-header h1 {
    margin-top: var(--space-4);
  }
  .space-detail-meta {
    color: var(--text-2);
    margin-top: var(--space-1);
  }
  .space-detail-badges {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }
  .space-detail-section {
    margin-top: var(--space-7);
  }
  .space-detail-section h2 {
    margin-bottom: var(--space-4);
  }
  .fact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--space-4);
  }
  .fact-row {
    background: var(--surface-1);
    border-radius: var(--radius-sm);
    padding: var(--space-3) var(--space-4);
  }
  .fact-row dt {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    color: var(--text-2);
    font-size: var(--text-xs);
    font-weight: 600;
  }
  .fact-row dd {
    margin: var(--space-1) 0 0;
    font-weight: 600;
  }
  .space-detail-notes {
    color: var(--text-2);
    line-height: var(--leading-loose);
    white-space: pre-line;
  }
  .space-mini-map {
    height: 260px;
    border-radius: var(--radius-md);
    margin-top: var(--space-4);
    overflow: hidden;
  }
  .space-detail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3);
    margin-top: var(--space-4);
  }

  .checkin-form {
    display: grid;
    gap: var(--space-4);
    max-width: 420px;
  }

  .checkin-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    background: var(--surface-1);
    border-radius: var(--radius-sm);
    margin-top: var(--space-2);
  }
  .checkin-row-day {
    font-weight: 700;
    min-width: 9ch;
  }

  .reviews-summary {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-6);
    align-items: flex-start;
    margin-bottom: var(--space-5);
  }
  .reviews-avg {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--text-lg);
    font-family: var(--font-display);
    font-weight: 800;
    color: var(--accent);
  }
  .reviews-distribution {
    display: grid;
    gap: var(--space-1);
    min-width: 200px;
  }
  .reviews-distribution-row {
    display: grid;
    grid-template-columns: 2.5ch 1fr 2ch;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--text-xs);
  }
  .reviews-bar {
    display: block;
    height: 8px;
    border-radius: var(--radius-pill);
    background: var(--surface-2);
    overflow: hidden;
  }
  .reviews-bar-fill {
    display: block;
    height: 100%;
    background: var(--accent);
  }
  .reviews-list {
    display: grid;
    gap: var(--space-3);
    margin-top: var(--space-4);
  }
  .review-card--mine {
    border: 2px solid var(--accent);
  }
  .review-card-rating {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    font-weight: 700;
    color: var(--accent);
  }
  .review-form {
    display: grid;
    gap: var(--space-4);
    max-width: 420px;
    margin-top: var(--space-4);
  }
</style>

<a class="skip-link" href="#space-detail">Vai al contenuto</a>

<main id="space-detail" class="space-detail-page">
  <div class="space-detail-skeleton skeleton" style="height: 48px; width: 60%;"></div>
  <div class="space-detail-skeleton skeleton" style="height: 200px; margin-top: 24px;"></div>
  <div class="space-detail-skeleton skeleton" style="height: 120px; margin-top: 24px;"></div>
</main>
