# netlify.toml
# Sito statico multi-pagina: ogni URL corrisponde a un file reale
# (index.html, app.html, space.html, profile.html, admin/index.html,
# privacy.html), quindi non serve nessun redirect SPA-style. Questo file
# serve solo per gli header di sicurezza (sezione 10).

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
      font-src https://fonts.gstatic.com;
      img-src 'self' data: https://*.tile.openstreetmap.org https://*.supabase.co https://cdn.jsdelivr.net;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
    """
